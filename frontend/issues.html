<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Repository Analytics - Issues</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="brand-icon">GH</div>

                <h2>GitHub Analytics</h2>

            </div>
            <nav class="sidebar-nav">

    <a href="dashboard.html" class="nav-link">
        Dashboard
    </a>

    <a href="repositories.html" class="nav-link">
        Repositories
    </a>

    <a href="users.html" class="nav-link">
        Users
    </a>

    <a href="issues.html" class="nav-link active">
        Issues
    </a>

    <a href="pull_requests.html" class="nav-link">
        Pull Requests
    </a>

    <a href="commits.html" class="nav-link">
        Commits
    </a>

    <a href="languages.html" class="nav-link">
        Languages
    </a>
    <a href="repository_management.html" class="nav-link">
        Repository Management
    </a>

</nav>


            <div class="sidebar-bottom">

                <a href="#" class="nav-link" id="logoutLink">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Bar -->
            <header class="topbar">

                <div>

                    <h1>Issues</h1>

                    <p>
                        Track and analyze repository issues.
                    </p>

                </div>

                <div class="user-info">

                    <span data-user-greeting>Welcome</span>
                    <span class="user-role-badge" data-user-role hidden></span>

                </div>

            </header>


            <!-- Issues Content -->
            <section class="dashboard-content">

                <div class="page-heading">

                    <h2>Issue Overview</h2>

                    <p>
                        Browse issues and their current status.
                    </p>

                </div>


                <!-- Search and Filter -->
                <div class="repository-toolbar">

                    <input
                        type="text"
                        id="issueSearch"
                        placeholder="Search issues..."
                    >

                    <select id="issueStateFilter">

                        <option value="">All States</option>

                        <option value="open">
                            Open
                        </option>

                        <option value="closed">
                            Closed
                        </option>

                    </select>

                </div>


                <!-- Issues Table -->
                <div class="table-card">

                    <table>

                        <thead>

                            <tr>

                                <th>Issue ID</th>

                                <th>Title</th>

                                <th>State</th>

                                <th>Created At</th>

                                <th>Closed At</th>

                            </tr>

                        </thead>


                        <tbody id="issuesTableBody">
</tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
