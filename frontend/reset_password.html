<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Choose a New Password - GitHub Repository Analytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="brand">
                <div class="brand-icon">GH</div>
                <h1>Choose a new password</h1>
                <p>Reset links expire after 30 minutes and can only be used once.</p>
            </div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">Confirm new password</label>
                    <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="login-button" id="resetPasswordButton">Save new password</button>
                <p id="resetPasswordMessage" class="register-text" role="status" aria-live="polite"></p>
                <p class="register-text"><a href="login.html">Back to login</a></p>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
