<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Repository Analytics - Languages</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="sidebar-brand">

                <div class="brand-icon">GH</div>

                <h2>GitHub Analytics</h2>

            </div>


            <nav class="sidebar-nav">

    <a href="dashboard.html" class="nav-link">
        Dashboard
    </a>

    <a href="repositories.html" class="nav-link">
        Repositories
    </a>

    <a href="users.html" class="nav-link">
        Users
    </a>

    <a href="issues.html" class="nav-link">
        Issues
    </a>

    <a href="pull_requests.html" class="nav-link">
        Pull Requests
    </a>

    <a href="commits.html" class="nav-link">
        Commits
    </a>

    <a href="languages.html" class="nav-link active">
        Languages
    </a>
    <a href="repository_management.html" class="nav-link">
        Repository Management
    </a>

</nav>


            <div class="sidebar-bottom">

                <a href="#" class="nav-link" id="logoutLink">
                    Logout
                </a>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Bar -->
            <header class="topbar">

                <div>

                    <h1>Languages</h1>

                    <p>
                        Explore programming languages used in repositories.
                    </p>

                </div>

                <div class="user-info">

                    <span>Welcome, User</span>

                </div>

            </header>


            <!-- Languages Content -->
            <section class="dashboard-content">

                <div class="page-heading">

                    <h2>Language Overview</h2>

                    <p>
                        Analyze language usage across repositories.
                    </p>

                </div>


                <!-- Search -->
                <div class="repository-toolbar">

                    <input
                        type="text"
                        id="languageSearch"
                        placeholder="Search languages..."
                    >

                </div>


                <!-- Languages Table -->
                <div class="table-card">

                    <table>

                       <thead>
    <tr>
        <th>Language ID</th>
        <th>Language Name</th>
    </tr>
</thead>


                        <tbody id="languagesTableBody">
</tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="js/app.js"></script>

</body>

</html>
