<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Forgot Password - GitHub Repository Analytics</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="brand">
                <div class="brand-icon">GH</div>
                <h1>Reset your password</h1>
                <p>Enter your account email and we’ll send a one-time reset link if recovery is available.</p>
            </div>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="recoveryEmail">Email</label>
                    <input type="email" id="recoveryEmail" autocomplete="email" maxlength="255" placeholder="Enter your account email" required>
                </div>
                <button type="submit" class="login-button" id="forgotPasswordButton">Send reset link</button>
                <p id="forgotPasswordMessage" class="register-text" role="status" aria-live="polite"></p>
                <p class="register-text"><a href="login.html">Back to login</a></p>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
